<style>
  /* ============================================================
     HOUSEHOLD FLOW — "Today"  (a usable board, function first)
     Who's doing what · add · assign · complete · reward kids
     ============================================================ */
  .app{ --bg:#F3F3F1; --panel:#FFFFFF; --sunk:#ECECEA; --ink:#1B1C1E; --muted:#6A6C70;
        --faint:#9A9CA1; --hair:rgba(20,22,26,.09); --hair2:rgba(20,22,26,.05);
        --shadow:0 1px 2px rgba(20,22,26,.05),0 6px 20px -8px rgba(20,22,26,.14);
        /* people (functional color-coding, distinct & accessible) */
        --maya:#E85C46; --sam:#2E7CF6; --leo:#8B5CF6; --ada:#0FA79A; --none:#9A9CA1;
        font-family:"SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; background:var(--bg); }
  .app *{ box-sizing:border-box; }
  @media (prefers-color-scheme:dark){ .app{ --bg:#101113; --panel:#191B1E; --sunk:#141517; --ink:#ECEDEF;
        --muted:#9A9DA3; --faint:#6C6F75; --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.05);
        --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6); } }
  .app[data-theme="light"]{ --bg:#F3F3F1; --panel:#FFF; --sunk:#ECECEA; --ink:#1B1C1E; --muted:#6A6C70; --faint:#9A9CA1; --hair:rgba(20,22,26,.09); --hair2:rgba(20,22,26,.05); --shadow:0 1px 2px rgba(20,22,26,.05),0 6px 20px -8px rgba(20,22,26,.14); }
  .app[data-theme="dark"]{ --bg:#101113; --panel:#191B1E; --sunk:#141517; --ink:#ECEDEF; --muted:#9A9DA3; --faint:#6C6F75; --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.05); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6); }

  .wrap{ max-width:1120px; margin:0 auto; padding:clamp(18px,3vw,30px) clamp(14px,3vw,28px) 60px; }

  /* Header */
  .top{ display:flex; justify-content:space-between; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
  .h-day{ font-size:clamp(1.6rem,1.2rem+1.6vw,2.2rem); font-weight:700; letter-spacing:-.02em; margin:0; }
  .h-sub{ color:var(--muted); font-size:.95rem; margin:3px 0 0; }
  .prog{ display:flex; align-items:center; gap:12px; }
  .prog .bar{ width:150px; height:8px; border-radius:99px; background:var(--sunk); overflow:hidden; }
  .prog .fill{ height:100%; background:var(--ink); border-radius:99px; transition:width .4s cubic-bezier(.3,0,.1,1); }
  .prog .lbl{ font-size:.9rem; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .theme{ display:inline-flex; background:var(--sunk); border-radius:99px; padding:3px; }
  .theme button{ font:inherit; font-size:.8rem; font-weight:600; border:0; background:transparent; color:var(--muted);
    padding:5px 12px; border-radius:99px; cursor:pointer; }
  .theme button[aria-pressed="true"]{ background:var(--panel); color:var(--ink); box-shadow:var(--shadow); }

  /* Board */
  .board{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity; }
  .lane{ scroll-snap-align:start; flex:1 0 216px; min-width:216px; background:var(--sunk);
    border-radius:16px; padding:10px; display:flex; flex-direction:column; gap:9px; }
  .lane-h{ display:flex; align-items:center; gap:9px; padding:4px 4px 2px; }
  .av{ width:30px; height:30px; border-radius:99px; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.85rem; color:#fff; background:var(--pc,var(--none)); flex-shrink:0; }
  .av.sm{ width:22px; height:22px; font-size:.7rem; }
  .av.dash{ background:transparent; color:var(--faint); border:1.5px dashed var(--faint); }
  .lane-name{ font-weight:650; font-size:.98rem; letter-spacing:-.01em; }
  .lane-meta{ font-size:.76rem; color:var(--muted); margin-top:1px; display:flex; align-items:center; gap:5px; }
  .stars{ color:#E7A417; font-weight:700; display:inline-flex; align-items:center; gap:2px; }
  .lane-add{ margin-left:auto; width:26px; height:26px; border-radius:8px; border:0; background:transparent;
    color:var(--muted); font-size:1.15rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lane-add:hover{ background:var(--hair2); color:var(--ink); }

  /* Task card */
  .card{ background:var(--panel); border:1px solid var(--hair); border-radius:12px; padding:10px 11px;
    display:flex; align-items:flex-start; gap:10px; box-shadow:0 1px 1px rgba(20,22,26,.03);
    transition:opacity .25s, transform .25s; cursor:default; }
  .card.done{ opacity:.5; }
  .check{ width:21px; height:21px; border-radius:99px; border:2px solid var(--pc,var(--faint)); background:transparent;
    flex-shrink:0; cursor:pointer; padding:0; position:relative; margin-top:1px; transition:background .18s, transform .12s; }
  .check:hover{ transform:scale(1.08); }
  .check:active{ transform:scale(.9); }
  .check.on{ background:var(--pc,var(--ink)); }
  .check.on::after{ content:""; position:absolute; left:6px; top:2.5px; width:5px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(42deg); }
  .card .body{ flex:1; min-width:0; }
  .card .title{ font-size:.92rem; line-height:1.3; word-break:break-word; }
  .card.done .title{ text-decoration:line-through; text-decoration-color:var(--faint); }
  .card .sub{ font-size:.73rem; color:var(--faint); margin-top:2px; }
  .card .suggest{ color:var(--sam); font-weight:600; }
  .card .own{ margin-left:auto; }
  .own-btn{ border:0; background:transparent; padding:0; cursor:pointer; border-radius:99px; }
  .own-btn:hover{ filter:brightness(1.08); }
  .del{ border:0; background:transparent; color:var(--faint); cursor:pointer; font-size:.95rem; line-height:1;
    padding:2px 4px; border-radius:6px; opacity:0; transition:opacity .15s; }
  .card:hover .del{ opacity:1; }
  .del:hover{ color:var(--maya); background:var(--hair2); }
  .empty{ font-size:.8rem; color:var(--faint); text-align:center; padding:14px 6px; }

  /* Inline add input */
  .addbox{ display:flex; gap:6px; }
  .addbox input{ flex:1; font:inherit; font-size:.9rem; padding:8px 10px; border-radius:9px;
    border:1px solid var(--hair); background:var(--panel); color:var(--ink); outline:none; }
  .addbox input:focus{ border-color:var(--pc,var(--ink)); }

  /* Assignee popover */
  .pop{ position:fixed; z-index:50; background:var(--panel); border:1px solid var(--hair); border-radius:12px;
    box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; gap:2px; min-width:172px; }
  .pop .ph{ font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); padding:5px 8px 3px; font-weight:700; }
  .pop button{ display:flex; align-items:center; gap:9px; font:inherit; font-size:.88rem; color:var(--ink);
    background:transparent; border:0; border-radius:8px; padding:7px 8px; cursor:pointer; text-align:left; width:100%; }
  .pop button:hover{ background:var(--sunk); }
  .pop .tick{ margin-left:auto; color:var(--muted); }

  /* Floating star reward */
  .fstar{ position:fixed; z-index:60; font-size:1.3rem; pointer-events:none; color:#E7A417;
    animation:floatstar 1s cubic-bezier(.3,0,.2,1) forwards; }
  @keyframes floatstar{ 0%{ transform:translateY(0) scale(.6); opacity:0; }
    25%{ transform:translateY(-10px) scale(1.15); opacity:1; }
    100%{ transform:translateY(-46px) scale(1); opacity:0; } }

  .app :focus-visible{ outline:2px solid var(--sam); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  @media (max-width:560px){ .lane{ flex-basis:78vw; min-width:78vw; } }
</style>

<div class="app" id="app">
  <div class="wrap">
    <header class="top">
      <div>
        <h1 class="h-day" id="dayTitle">Today</h1>
        <p class="h-sub">The Rivera household &middot; <span id="dateStr"></span></p>
      </div>
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <div class="prog">
          <div class="bar"><div class="fill" id="progFill"></div></div>
          <span class="lbl" id="progLbl">0 of 0 done</span>
        </div>
        <div class="theme" role="group" aria-label="Theme">
          <button data-theme-set="light">Light</button>
          <button data-theme-set="dark">Dark</button>
          <button data-theme-set="system" aria-pressed="true">Auto</button>
        </div>
      </div>
    </header>

    <div class="board" id="board"></div>
  </div>
</div>

<script>
(function(){
  var app=document.getElementById('app'), board=document.getElementById('board');

  // theme
  [].forEach.call(document.querySelectorAll('[data-theme-set]'),function(b){
    b.addEventListener('click',function(){
      var m=b.dataset.themeSet; if(m==='system') app.removeAttribute('data-theme'); else app.setAttribute('data-theme',m);
      document.querySelectorAll('[data-theme-set]').forEach(function(x){x.setAttribute('aria-pressed', x===b);});
    });
  });
  document.getElementById('dateStr').textContent =
    new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

  // ---- Data ----
  var people=[
    {id:'maya', name:'Maya', kind:'parent', color:'var(--maya)'},
    {id:'sam',  name:'Sam',  kind:'parent', color:'var(--sam)'},
    {id:'leo',  name:'Leo',  kind:'kid', age:10, color:'var(--leo)', stars:3},
    {id:'ada',  name:'Ada',  kind:'kid', age:7,  color:'var(--ada)', stars:5}
  ];
  var P={}; people.forEach(function(p){P[p.id]=p;});
  var uid=100;
  var tasks=[
    {id:1, title:'Water the plants', owner:'leo',  done:false},
    {id:2, title:'Pick dinner',      owner:'maya', done:false},
    {id:3, title:'Take out the trash',owner:'sam', done:false},
    {id:4, title:'Pick up the kids',  owner:'sam', done:false},
    {id:5, title:'Mow the lawn',      owner:null,  done:false, suggest:'sam'}
  ];

  function av(pid, cls){ var p=pid?P[pid]:null;
    if(!p) return '<span class="av dash '+(cls||'')+'">?</span>';
    return '<span class="av '+(cls||'')+'" style="--pc:'+p.color+'">'+p.name[0]+'</span>'; }

  // lane order: Unassigned (only if needed) + everyone
  function lanes(){ var l=[]; if(tasks.some(function(t){return !t.owner;})) l.push(null); people.forEach(function(p){l.push(p.id);}); return l; }

  function render(){
    var done=tasks.filter(function(t){return t.done;}).length, total=tasks.length;
    document.getElementById('progFill').style.width = (total? (done/total*100):0)+'%';
    document.getElementById('progLbl').textContent = done+' of '+total+' done';

    board.innerHTML='';
    lanes().forEach(function(pid){
      var p=pid?P[pid]:null;
      var mine=tasks.filter(function(t){return t.owner===pid;})
                    .sort(function(a,b){return (a.done?1:0)-(b.done?1:0);});
      var todo=mine.filter(function(t){return !t.done;}).length;
      var lane=document.createElement('div'); lane.className='lane';
      lane.style.setProperty('--pc', p?p.color:'var(--none)');

      var meta = p ? (p.kind==='kid'
            ? todo+' to do <span class="stars">&#9733; '+p.stars+'</span>'
            : todo+' to do')
          : todo+' to assign';
      lane.innerHTML =
        '<div class="lane-h">'+ av(pid) +
          '<div><div class="lane-name">'+(p?p.name+(p.kind==='kid'?' &middot; '+p.age:''):'Unassigned')+'</div>'+
          '<div class="lane-meta">'+meta+'</div></div>'+
          '<button class="lane-add" data-add="'+(pid||'')+'" title="Add a task" aria-label="Add a task for '+(p?p.name:'anyone')+'">+</button>'+
        '</div>';

      var bodyWrap=document.createElement('div');
      bodyWrap.style.cssText='display:flex;flex-direction:column;gap:8px;';
      if(!mine.length){ bodyWrap.innerHTML='<div class="empty">'+(p?'Nothing yet':'All assigned')+'</div>'; }
      mine.forEach(function(t){
        var card=document.createElement('div'); card.className='card'+(t.done?' done':'');
        card.style.setProperty('--pc', p?p.color:'var(--faint)');
        var sub = t.done ? '<div class="sub">Done</div>'
                 : (!t.owner && t.suggest ? '<div class="sub">Suggested: <span class="suggest">'+P[t.suggest].name+'</span></div>' : '');
        card.innerHTML =
          '<button class="check'+(t.done?' on':'')+'" data-toggle="'+t.id+'" aria-label="Mark '+t.title+(t.done?' not done':' done')+'"></button>'+
          '<div class="body"><div class="title">'+t.title+'</div>'+sub+'</div>'+
          '<button class="del" data-del="'+t.id+'" title="Delete" aria-label="Delete '+t.title+'">&times;</button>'+
          '<span class="own"><button class="own-btn" data-assign="'+t.id+'" aria-label="Assign '+t.title+'">'+av(t.owner,'sm')+'</button></span>';
        bodyWrap.appendChild(card);
      });
      lane.appendChild(bodyWrap);
      board.appendChild(lane);
    });
  }

  // ---- Actions (event delegation) ----
  board.addEventListener('click',function(e){
    var t;
    if((t=e.target.closest('[data-toggle]'))){ toggle(+t.dataset.toggle, t); }
    else if((t=e.target.closest('[data-del]'))){ tasks=tasks.filter(function(x){return x.id!=t.dataset.del;}); render(); }
    else if((t=e.target.closest('[data-assign]'))){ openPicker(+t.dataset.assign, t); }
    else if((t=e.target.closest('[data-add]'))){ inlineAdd(t.dataset.add||null, t.closest('.lane')); }
  });

  function toggle(id, btn){
    var t=tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
    t.done=!t.done;
    if(t.done && t.owner && P[t.owner].kind==='kid'){ P[t.owner].stars++; star(btn); }
    else if(!t.done && t.owner && P[t.owner].kind==='kid'){ P[t.owner].stars=Math.max(0,P[t.owner].stars-1); }
    render();
  }
  function star(el){ var r=el.getBoundingClientRect(); var s=document.createElement('div');
    s.className='fstar'; s.textContent='★'; s.style.left=(r.left)+'px'; s.style.top=(r.top-6)+'px';
    document.body.appendChild(s); setTimeout(function(){s.remove();},1000); }

  function inlineAdd(owner, lane){
    if(lane.querySelector('.addbox')) { lane.querySelector('.addbox input').focus(); return; }
    var box=document.createElement('div'); box.className='addbox';
    box.innerHTML='<input type="text" placeholder="Add a task&hellip;" aria-label="New task">';
    lane.appendChild(box); var inp=box.querySelector('input'); inp.focus();
    function commit(){ var v=inp.value.trim(); if(v){ tasks.push({id:++uid, title:v, owner:owner||null, done:false}); render(); }
      else box.remove(); }
    inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ commit(); }
      else if(ev.key==='Escape'){ box.remove(); } });
    inp.addEventListener('blur', function(){ setTimeout(function(){ if(document.body.contains(box)) commit(); },120); });
  }

  var openPop=null;
  function openPicker(id, anchor){
    closePop();
    var t=tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
    var pop=document.createElement('div'); pop.className='pop';
    var html='<div class="ph">Assign to</div>';
    people.forEach(function(p){
      html+='<button data-set="'+p.id+'">'+av(p.id,'sm')+' '+p.name+(p.kind==='kid'?' &middot; '+p.age:'')+
            (t.owner===p.id?'<span class="tick">&#10003;</span>':'')+'</button>';
    });
    html+='<button data-set="">'+ '<span class="av dash sm">?</span> Unassign'+(t.owner?'':'<span class="tick">&#10003;</span>')+'</button>';
    pop.innerHTML=html; document.body.appendChild(pop);
    var r=anchor.getBoundingClientRect();
    var x=Math.min(r.left, window.innerWidth-pop.offsetWidth-10);
    var y=r.bottom+6; if(y+pop.offsetHeight>window.innerHeight-10) y=r.top-pop.offsetHeight-6;
    pop.style.left=Math.max(10,x)+'px'; pop.style.top=y+'px';
    pop.addEventListener('click',function(e){ var b=e.target.closest('[data-set]'); if(!b) return;
      t.owner=b.dataset.set||null; if(t.owner) delete t.suggest; closePop(); render(); });
    openPop=pop;
    setTimeout(function(){ document.addEventListener('click', outside); },0);
  }
  function outside(e){ if(openPop && !openPop.contains(e.target)) closePop(); }
  function closePop(){ if(openPop){ openPop.remove(); openPop=null; document.removeEventListener('click',outside); } }

  render();
})();
</script>
