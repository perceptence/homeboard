    var navd=S._nav; S._nav=false; var flash=S._flash; S._flash=null;
    // toast always animates in (it is transient by nature)
    if(S.toast && !reduce){ var t=document.getElementById('toast');
      if(t) t.animate([{opacity:0,transform:'translateX(-50%) translateY(20px)'},{opacity:1,transform:'translateX(-50%) translateY(0)'}],{duration:260,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'}); }
    // counts/bars must be correct even when we skip motion
    [].forEach.call(app.querySelectorAll('[data-count]'),function(el){ el.textContent=el.dataset.count+'%'; });
    if(reduce) return;

    if(navd){
      // staggered entrance — ONLY on navigation, so mutations never re-flash the screen
      [].forEach.call(app.querySelectorAll('.ph-body > *, .ip-content .view > *'),function(el,i){ if(i>9) return;
        el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
          {duration:380,delay:i*42,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}); });
      // count-up
      [].forEach.call(app.querySelectorAll('[data-count]'),function(el){ var to=+el.dataset.count, st=performance.now();
        (function step(now){ var p=Math.min(1,(now-st)/750); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+'%'; if(p<1) requestAnimationFrame(step); })(st); });
      // bars grow from zero
      [].forEach.call(app.querySelectorAll('.prog-fill,.subbar > i'),function(el){ var w=el.style.width; el.style.width='0';
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.width=w; }); }); });
    }
    if(flash){ var row=app.querySelector('[data-id="'+flash+'"]'); var host=row&&(row.closest('.trow')||row.closest('.c'));
      if(host) host.classList.add('just-done'); }
    // sheet: gently push the content behind it back (iOS-style depth)
    var behind=app.querySelector('.ip')||app.querySelector('.scroll');
    if(behind){ behind.style.transition='transform .32s cubic-bezier(.2,.8,.2,1), filter .32s';
      if(S.sheet){ behind.style.transform='scale(.985)'; behind.style.filter='brightness(.97)'; }
      else { behind.style.transform=''; behind.style.filter=''; } }
  }
  function toast(txt,e){ S.toast={txt:txt,e:e}; render(); clearTimeout(toast._t); toast._t=setTimeout(function(){ S.toast=null; render(); },1900); }
  function starPop(x,y){ if(reduce)return; var s=document.createElement('div'); s.className='fstar'; s.textContent='⭐'; s.style.left=x+'px'; s.style.top=y+'px'; document.body.appendChild(s);
    s.animate([{opacity:0,transform:'translateY(0) scale(.5)'},{opacity:1,transform:'translateY(-18px) scale(1.2)',offset:.3},{opacity:0,transform:'translateY(-60px) scale(1)'}],{duration:1000,easing:'cubic-bezier(.2,.7,.2,1)'}).onfinish=function(){s.remove();}; }

  /* ================= ACTIONS ================= */
  function toggleTask(id,ev){ var t=tById(id); if(!t) return; t.done=!t.done;
    if(t.done && t.own && M[t.own].kind==='kid'){ M[t.own].stars++; if(ev){ var r=ev.target.getBoundingClientRect(); starPop(r.left,r.top); } toast(M[t.own].n+' earned a star! ','⭐'); }
    else if(!t.done && t.own && M[t.own].kind==='kid'){ M[t.own].stars=Math.max(0,M[t.own].stars-1); }
    else if(t.done){ toast('Nice — that’s done','✓'); }
    log((t.own?M[t.own].n:'Someone')+(t.done?' completed ':' reopened ')+'“'+t.t+'”'); if(S.sheet&&S.sheet.type==='task')S.sheet=null;
    S._flash=id; render(); }
  function rebalance(){ var loads={}; ['maya','sam','leo','ada'].forEach(function(k){loads[k]=pendingFor(k);});
    var heavy=Object.keys(loads).sort(function(a,b){return loads[b]-loads[a];})[0]; var light=Object.keys(loads).sort(function(a,b){return loads[a]-loads[b];})[0];
    var mv=S.tasks.filter(function(t){return t.own===heavy&&!t.done&&t.pri!=='high';})[0]||S.tasks.filter(function(t){return t.own===heavy&&!t.done;})[0];
    if(mv){ mv.own=light; log('Moved “'+mv.t+'” from '+M[heavy].n+' to '+M[light].n); toast('Moved to '+M[light].n+' — nicely balanced','⚖️'); } render(); }

  window.__hf={ draft:function(k,v){ if(S.sheet&&S.sheet.draft) S.sheet.draft[k]=v; },
    addSub:function(id,v){ v=(v||'').trim(); if(!v)return; var t=tById(id); t.subs.push({t:v,done:false}); render(); setTimeout(function(){var el=document.getElementById('subInput'); if(el)el.focus();},30); },
    search:function(q){ q=(q||'').trim().toLowerCase(); if(!q){ if(S.ipRoute==='search'){S.ipRoute='home';render();} return; }
      var hits=[]; S.tasks.forEach(function(t){if(t.t.toLowerCase().indexOf(q)>-1)hits.push(['✅',t.t,'Task'+(t.own?' · '+M[t.own].n:'')]);});
      shopList().forEach(function(s){if(s.t.toLowerCase().indexOf(q)>-1)hits.push(['🛒',s.t,'Shopping · '+s.cat]);});
      S.bills.forEach(function(b){if(b.t.toLowerCase().indexOf(q)>-1)hits.push(['💸',b.t,'Bill · $'+b.amt]);});
      S.inv.forEach(function(i){if(i.t.toLowerCase().indexOf(q)>-1)hits.push(['📦',i.t,'Inventory · '+i.loc]);});
      var content=document.getElementById('scroll'); if(!content)return;
      content.innerHTML='<div class="view"><h1 style="font-size:1.5rem">Results for “'+esc(q)+'”</h1><div class="muted" style="font-weight:600;margin:4px 0 12px">'+hits.length+' across your home</div>'+(hits.length?'<div class="c c-white" style="padding:6px 18px">'+hits.map(function(h){return '<div class="trow" style="cursor:default"><span class="emoji" style="font-size:1.2rem;width:30px">'+h[0]+'</span><div class="grow"><div class="tt" style="font-size:.95rem">'+esc(h[1])+'</div><div class="muted" style="font-size:.82rem">'+h[2]+'</div></div></div>';}).join('')+'</div>':'<div class="empty">No matches yet.</div>')+'</div>'; }
  };

  /* ================= EVENT DELEGATION ================= */
  document.addEventListener('click',function(e){
    var sw=e.target.closest('[data-p]'); if(sw){ S.persona=sw.dataset.p; S._nav=true; renderSwitch(); render(); return; }
    var el=e.target.closest('[data-a]'); if(!el) return; var a=el.dataset.a, id=el.dataset.id;
    switch(a){
      case 'go': S.ipRoute=el.dataset.r; S._nav=true; render(); break;
      case 'phgo': S.phRoute=el.dataset.r; S._nav=true; render(); break;
      case 'toggle': toggleTask(id,e); break;
      case 'open': S.sheet={type:'task',id:+id}; render(); break;
      case 'assign': S.sheet={type:'assign',id:+id}; render(); break;
      case 'handoff': S.sheet={type:'handoff',id:+id}; render(); break;
      case 'setOwner': { var t=tById(id); var w=el.dataset.who; var prev=t.own; t.own=w||null; if(w&&t.suggest)delete t.suggest;
        if(el.dataset.hand) log((prev?M[prev].n:'Someone')+' handed “'+t.t+'” to '+(w?M[w].n:'no one'));
        S.sheet=null; toast(w?'Assigned to '+M[w].n:'Unassigned','👤'); render(); break; }
      case 'suggest': { var t=tById(id); if(t&&t.suggest){ t.own=t.suggest; delete t.suggest; toast('Assigned to '+M[t.own].n,'👤'); log('Assigned “'+t.t+'” to '+M[t.own].n); } render(); break; }
      case 'subtoggle': { var t=tById(id); var st=t.subs[+el.dataset.i]; st.done=!st.done; render(); break; }
      case 'rebalance': rebalance(); break;
      case 'pay': { var b=S.bills.filter(function(x){return x.id===id;})[0]; b.st='paid'; toast('Paid $'+b.amt+' — '+b.t,'💸'); log('Paid the '+b.t+' bill'); render(); break; }
      case 'restock': { var i=S.inv.filter(function(x){return x.id===id;})[0]; i.st='ok'; i.qty='Restocked'; toast(i.t+' back in stock','📦'); log('Restocked '+i.t); render(); break; }
      case 'scheduleM': { var m=S.maint.filter(function(x){return x.id===id;})[0]; m.st='up'; m.when='Scheduled'; toast(m.t+' scheduled','🔧'); render(); break; }
      case 'toggleAuto': { var au=S.autos.filter(function(x){return x.id===id;})[0]; au.on=!au.on; toast(au.t+(au.on?' on':' off'),'⚡'); render(); break; }
      case 'newtask': S.sheet={type:'newtask',draft:{t:'',own:me()==='maya'?'maya':me(),when:'Today',pri:'med'}}; render(); break;
      case 'newshop': S.sheet={type:'newshop',draft:{t:'',cat:'Groceries'}}; render(); break;
      case 'newevent': S.sheet={type:'newevent',draft:{t:'',time:'',who:'maya'}}; render(); break;
      case 'ipadd': S.sheet={type:'newtask',draft:{t:'',own:'maya',when:'Today',pri:'med'}}; render(); break;
      case 'phadd': S.sheet={type:'newtask',draft:{t:'',own:me(),when:'Today',pri:'med'}}; render(); break;
      case 'draftOwn': S.sheet.draft.own=el.dataset.who; render(); break;
      case 'draftWhen': S.sheet.draft.when=el.dataset.w; render(); break;
      case 'draftPri': S.sheet.draft.pri=el.dataset.p; render(); break;
      case 'draftCat': S.sheet.draft.cat=el.dataset.c; render(); break;
      case 'draftEvWho': S.sheet.draft.who=el.dataset.who; render(); break;
      case 'saveTask': { var d=S.sheet.draft; var ti=(document.getElementById('ntTitle')||{}).value||d.t; if(!ti.trim()){toast('Give it a title first','✏️');break;}
        S.tasks.unshift({id:++uid,t:ti.trim(),own:d.own,dom:'chore',when:d.when,ord:d.when==='Today'?1:2,done:false,pri:d.pri,subs:[]});
        log(M[me()].n+' added “'+ti.trim()+'”'+(d.own?' for '+M[d.own].n:'')); S.sheet=null; toast('Task added'+(d.own?' for '+M[d.own].n:''),'✅'); render(); break; }
      case 'saveShop': { var d=S.sheet.draft; var ti=(document.getElementById('nsTitle')||{}).value||d.t; if(!ti.trim()){toast('Name the item','✏️');break;}
        S.shopping.unshift({id:'s'+(++uid),t:ti.trim(),cat:d.cat,low:false,done:false}); S.sheet=null; toast('Added to shopping','🛒'); render(); break; }
      case 'saveEvent': { var d=S.sheet.draft; var ti=(document.getElementById('neTitle')||{}).value||d.t; if(!ti.trim()){toast('Name the event','✏️');break;}
        S.events.push({id:'e'+(++uid),d:0,t:ti.trim(),time:(document.getElementById('neTime')||{}).value||d.time||'—',who:d.who}); S.sheet=null; toast('Event added','📅'); render(); break; }
      case 'delTask': { S.tasks=S.tasks.filter(function(t){return t.id!=id;}); S.sheet=null; toast('Task deleted'); render(); break; }
      case 'notif': S.sheet={type:'notif'}; render(); break;
      case 'closeSheet': S.sheet=null; render(); break;
    }
  });

  // Escape closes any open sheet (a11y + expected behaviour)
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && S.sheet){ S.sheet=null; render(); } });

  renderSwitch(); render();
})();
</script>
