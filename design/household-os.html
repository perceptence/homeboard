     HOUSEHOLD FLOW — Household Operating System

  /* Common bits */
  .grid{ display:grid; gap:14px; }
  .cols-4{ grid-template-columns:repeat(4,1fr); } .cols-3{ grid-template-columns:repeat(3,1fr); } .cols-2{ grid-template-columns:repeat(2,1fr); }

  /* Row list */

  .pill.good{ background:var(--good-soft); color:var(--good); } .pill.info{ background:var(--info-soft); color:var(--info); }

  .ai .k{ width:28px; height:28px; border-radius:99px; background:var(--accent); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; }
  .ai .k svg{ width:15px; height:15px; }
  .ai .tx{ font-size:.88rem; line-height:1.4; }

  .ai .why{ font-size:.78rem; color:var(--muted); margin-top:2px; }
  .ai .acts{ display:flex; gap:8px; margin-top:9px; }

  /* Calendar */
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal .d{ background:var(--panel); border:1px solid var(--hair); border-radius:11px; padding:8px; min-height:96px; }
  .cal .dn{ font-size:.74rem; color:var(--faint); font-weight:650; display:flex; justify-content:space-between; }
  .cal .d.today .dn{ color:var(--accent); }
  .cal .ev{ font-size:.71rem; font-weight:600; border-radius:6px; padding:3px 6px; margin-top:5px; line-height:1.2; }
  .caption{ font-size:.8rem; color:var(--muted); }

  /* misc */

  .kv{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--hair2); font-size:.88rem; }
  .kv:first-child{ border-top:0; } .kv .k{ color:var(--muted); }
  .chips{ display:flex; gap:7px; flex-wrap:wrap; }

  .os :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }

  /* Responsive: sidebar -> bottom bar */
  @media (max-width:860px){
    .shell{ grid-template-columns:1fr; }
    .side{ position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; z-index:40;
      border-right:0; border-top:1px solid var(--hair); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); gap:2px; overflow-x:auto; }
    .hh,.navlbl,.side-foot,.nav .badge{ display:none; }
    .nav{ flex-direction:row; flex:1; }
    .nav button{ flex-direction:column; gap:3px; font-size:.64rem; padding:7px 6px; min-width:60px; justify-content:center; }
    .content{ padding-bottom:90px; }
    .cols-4{ grid-template-columns:repeat(2,1fr); } .cols-3,.cols-2{ grid-template-columns:1fr; }
    .cal{ grid-template-columns:repeat(3,1fr); }
  }
</style>

    settings:function(){
      var s=[['Household','Rivera Home · 4 people, 1 pet'],['Members & permissions','Stewards, juniors, guests'],['Notifications','Quiet hours 9pm–7am'],['Privacy','Local-first · no ads, ever'],['Connected services','Calendar, bank (read-only)'],['AI preferences','Propose-first · you approve autonomy']];
      return '<div class="sec-h" style="margin-top:0"><div><h2 style="font-size:1.2rem">Settings</h2><div class="q">Household, members, privacy & AI</div></div></div><div class="panel rows">'+
        s.map(function(r){ return '<div class="row"><div class="dic" style="background:var(--sunk)"><span style="color:var(--muted)">'+ic('gear')+'</span></div><div class="grow"><div class="t">'+esc(r[0])+'</div><div class="m">'+esc(r[1])+'</div></div></div>'; }).join('')+'</div>';
    }
  };

  /* ---------- Nav + router ---------- */
  var NAV=[['home','home','Home'],['tasks','tasks','Tasks'],['shopping','cart','Shopping'],['calendar','cal','Calendar'],['household','house','Household'],['insights','chart','Insights'],['more','more','More']];
  var TITLES={home:'Home',tasks:'Tasks',shopping:'Shopping',calendar:'Calendar',household:'Household',insights:'Insights',more:'More',
    bills:'Bills',inventory:'Inventory',maintenance:'Home maintenance',automations:'Automations',documents:'Documents',settings:'Settings'};
  function badges(){ return { tasks: tasks.filter(function(t){return !t.done&&t.due===0;}).length,
    shopping: shopping.filter(function(s){return !s.done;}).length }; }
  var navEl=document.getElementById('nav');
  function drawNav(){ var b=badges();
    navEl.innerHTML=NAV.map(function(n){ var bg=b[n[0]]?'<span class="badge">'+b[n[0]]+'</span>':'';
      return '<button data-route="'+n[0]+'" class="'+(n[0]===route?'on':'')+'">'+ic(n[1])+'<span>'+n[2]+'</span>'+bg+'</button>'; }).join(''); }

  var route='home';
  function topOwner(r){ return ({bills:'more',inventory:'more',maintenance:'more',automations:'more',documents:'more',settings:'more'})[r]||r; }
  function go(r){ if(!Screens[r]) return; route=r;
    document.getElementById('ptitle').textContent=TITLES[r]||'Home';
    content.innerHTML=Screens[r]();
    var owner=topOwner(r);
    [].forEach.call(navEl.querySelectorAll('button'),function(btn){ btn.classList.toggle('on', btn.dataset.route===owner); });
    content.scrollTo?content.scrollTo(0,0):0; window.scrollTo(0,0);
  }

  /* ---------- Interactions ---------- */
  document.addEventListener('click',function(e){
    var r=e.target.closest('[data-route]'); if(r){ go(r.dataset.route); return; }
    var t=e.target.closest('[data-task]'); if(t){ var id=+t.dataset.task; var tk=tasks.filter(function(x){return x.id===id;})[0];
      if(tk){ tk.done=!tk.done; if(tk.done&&tk.owner&&P[tk.owner].kind==='kid') P[tk.owner].stars++;
        else if(!tk.done&&tk.owner&&P[tk.owner].kind==='kid') P[tk.owner].stars=Math.max(0,P[tk.owner].stars-1);
        drawNav(); go(route); } return; }
    var sh=e.target.closest('[data-shop]'); if(sh){ var s=shopping.filter(function(x){return x.id===sh.dataset.shop;})[0]; if(s){ s.done=!s.done; drawNav(); go(route);} return; }
    var sg=e.target.closest('[data-suggest]'); if(sg){ var tt=tasks.filter(function(x){return x.id===+sg.dataset.suggest;})[0]; if(tt){ tt.owner=tt.suggest; delete tt.suggest; drawNav(); go(route);} return; }
  });

  // theme
  [].forEach.call(document.querySelectorAll('[data-theme-set]'),function(b){ b.addEventListener('click',function(){
    var m=b.dataset.themeSet; if(m==='system') os.removeAttribute('data-theme'); else os.setAttribute('data-theme',m);
    document.querySelectorAll('[data-theme-set]').forEach(function(x){x.setAttribute('aria-pressed',x===b);}); }); });

  // search: filter into a results view
  var search=document.getElementById('search');
  search.addEventListener('input',function(){
    var q=search.value.trim().toLowerCase(); if(!q){ go(route); return; }
    var hits=[];
    tasks.forEach(function(t){ if(t.t.toLowerCase().indexOf(q)>-1) hits.push({dom:'tasks',t:t.t,m:'Task'+(t.owner?' · '+P[t.owner].n:'')}); });
    shopping.forEach(function(s){ if(s.t.toLowerCase().indexOf(q)>-1) hits.push({dom:'shop',t:s.t,m:'Shopping · '+s.cat}); });
    bills.forEach(function(b){ if(b.t.toLowerCase().indexOf(q)>-1) hits.push({dom:'bill',t:b.t,m:'Bill · $'+b.amt}); });
    inventory.forEach(function(i){ if(i.t.toLowerCase().indexOf(q)>-1) hits.push({dom:'inv',t:i.t,m:'Inventory · '+i.loc}); });
    maint.forEach(function(m){ if(m.t.toLowerCase().indexOf(q)>-1) hits.push({dom:'maint',t:m.t,m:'Maintenance · '+m.asset}); });
    document.getElementById('ptitle').textContent='Search';
    content.innerHTML='<div class="sec-h" style="margin-top:0"><h2>Results for “'+esc(search.value)+'”</h2><span class="q">'+hits.length+' across your home</span></div>'+
      (hits.length? '<div class="panel rows">'+hits.map(function(h){ return '<div class="row"><div class="dic" style="background:var(--sunk)"><span style="color:var(--muted)">'+ic(domIcon(h.dom))+'</span></div><div class="grow"><div class="t">'+esc(h.t)+'</div><div class="m">'+esc(h.m)+'</div></div></div>'; }).join('')+'</div>'
        : '<div class="panel empty">Nothing matches yet.</div>');
  });

  document.getElementById('add').addEventListener('click',function(){ go('tasks'); });

  drawNav(); go('home');
})();
</script>
